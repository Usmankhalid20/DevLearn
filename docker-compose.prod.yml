services:
  postgres:
    image: postgres:16-alpine
    container_name: devlearn_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devlearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlearn_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-devlearn_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlearn -d devlearn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devlearn_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: devlearn_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-devlearn}:${POSTGRES_PASSWORD:-devlearn_prod_password}@postgres:5432/${POSTGRES_DB:-devlearn_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-production_secure_session_secret_32_chars_long}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: devlearn_web_prod
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"

volumes:
  postgres_prod_data:
  redis_prod_data:
