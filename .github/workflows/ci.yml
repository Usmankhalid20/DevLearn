name: DevLearn CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devlearn
          POSTGRES_PASSWORD: devlearn_dev_password
          POSTGRES_DB: devlearn_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@devlearn/config
          npm run build --workspace=@devlearn/types
          npm run build --workspace=@devlearn/ui

      - name: Run Prisma DB push
        env:
          DATABASE_URL: postgresql://devlearn:devlearn_dev_password@127.0.0.1:5433/devlearn_db?schema=public
        run: npm run prisma:generate --workspace=@devlearn/api

      - name: Run TypeScript typecheck
        run: |
          npm run typecheck --workspace=@devlearn/api
          npm run typecheck --workspace=@devlearn/web

      - name: Run backend Vitest integration tests
        env:
          DATABASE_URL: postgresql://devlearn:devlearn_dev_password@127.0.0.1:5433/devlearn_db?schema=public
          SESSION_SECRET: test_session_secret_for_ci_pipeline_32bytes_long
        run: npm run test --workspace=@devlearn/api

      - name: Build Next.js web application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build --workspace=@devlearn/web
